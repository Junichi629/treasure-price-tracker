name: Daily price check

on:
  schedule:
    - cron: "0 0 * * *"   # 毎日 9:00 JST
  workflow_dispatch:       # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PRODUCT_IDS: "2087517284863156226,2087516465723973633"
      NOTIFY_ON_CHANGE_IDS: "2087516465723973633"   # 価格が変わった日だけ通知する商品
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_price.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "price: $(date -u +%F)"
          git push
      - name: Notify phone (ntfy)
        if: env.NTFY_TOPIC != ''
        run: python notify.py
